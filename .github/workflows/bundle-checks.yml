name: 3DS bundle checks
on:
  pull_request:
    paths:
      - '3ds/**'
      - '.github/workflows/bundle-checks.yml'
  workflow_dispatch:
concurrency:
  group: bundle-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify release identities, hashes and corresponding source
        run: python 3ds/tools/verify_release.py
      - name: Build desktop state-machine and display checks
        run: python 3ds/tools/build_host_tests.py
      - name: Exercise transfer, authentication, failure and receipt handling
        working-directory: 3ds/pc
        run: python -m unittest test_homebrew test_homebrew_data -q
      - name: Verify instructions, input handling and application palettes
        working-directory: 3ds/pc
        run: |
          node test_homebrew_flow.js
          node test_pointer_controls.js
      - name: Check reproducible extraction and offline startup
        run: python 3ds/tools/smoke_bundle.py
